<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Port คนโหด</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;1,900&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
/* Layout: fixed black sidebar + sticky top bar, torn-manga backdrop, one big glass panel per page holding the work */
:root{
  --ink:#030205; --panel:#0a0613; --card:#170d29; --card-line:#66448b; --line:#392747;
  --pink:#ff0da3; --violet:#660ae5; --neon:#a85bff; --yellow:#faf20a; --lime:#c2ff62;
  --text:#faf7ff; --mute:#b8adc7; --mute2:#b9a8cf; --faint:#8a78a8; --deep:#100a1c;
  --good:#c2ff62; --warn:#faf20a; --bad:#ff5d73;
  --f-th:'Kanit','Noto Sans Thai',system-ui,sans-serif;
  --f-ui:'Inter','Kanit',system-ui,sans-serif;
  --f-mono:'Space Grotesk','Inter',system-ui,sans-serif;
  --side:238px; --top:66px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:auto}
body{margin:0;overflow-x:clip;background:var(--ink);color:var(--text);font:14px/1.5 var(--f-th);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--ink) url(assets/bg.jpg) center/cover no-repeat}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
img{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* sidebar */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--ink);border-right:3px solid var(--pink);padding:24px 13px;z-index:30;display:flex;flex-direction:column;gap:22px}
.brand{font:500 29px/1.1 var(--f-ui);letter-spacing:-.5px;padding:0 10px;overflow-wrap:anywhere}
.brand b{font-weight:600}
.nav{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.nav button{display:flex;align-items:center;gap:12px;height:43px;padding:0 14px;border-radius:9px;text-align:left;font:400 15px var(--f-ui);color:var(--text);transition:background .15s}
.nav button i{font-style:normal;width:20px;text-align:center;opacity:.95}
.nav button:hover{background:#1a0f2e}
.nav button.on{background:var(--violet)}
.nav button[data-go=analyze]{color:var(--yellow)}
.side-foot{margin-top:auto;padding:0 10px;font:400 11px/1.5 var(--f-ui);color:var(--mute)}

/* shell */
.shell{margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:var(--top);background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 29px;gap:16px}
.crumb{font:400 14px var(--f-ui);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;background:var(--pink);border:1.5px solid var(--text);display:grid;place-items:center;font:600 16px var(--f-th);color:var(--ink)}
.logout{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;font-size:16px;color:var(--mute2)}
.logout:hover{background:#1a0f2e;color:var(--text)}
.me small{font:400 12px var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
main{flex:1;padding:0 32px 28px 29px;display:flex;flex-direction:column;gap:20px;min-width:0}

/* hero */
.hero{position:relative;min-height:395px}
.hero .art{position:absolute;right:6%;top:-6px;width:min(505px,40%);filter:drop-shadow(0 0 28px rgba(168,91,255,.35));pointer-events:none}
.hero .neon{z-index:1;position:absolute;left:0;top:176px}
.neon{display:flex;align-items:flex-end;gap:clamp(8px,1.6vw,24px);font-family:var(--f-th);font-style:italic;font-weight:900;line-height:.95;white-space:nowrap}
.neon .l1{font-size:clamp(70px,9vw,128px);color:var(--neon);text-shadow:4px 4px 0 var(--ink),0 0 26px rgba(168,91,255,.75),0 0 60px rgba(255,13,163,.35)}
.neon .l2{font-size:clamp(52px,6.7vw,96px);color:#fff;text-shadow:4px 4px 0 var(--ink),0 0 22px rgba(255,255,255,.35);margin-bottom:6px}
.hero-sub{position:absolute;left:4px;top:150px;font:500 12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}

/* glass panel */
.glass{position:relative;border-radius:24px;padding:22px 26px 28px 40px;background:linear-gradient(180deg,rgba(185,189,195,.16),rgba(119,124,132,.1) 50%,rgba(98,102,110,.16)),rgba(8,5,16,.62);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 0 14px 1px rgba(237,241,245,.3),inset 0 1px 3px rgba(255,255,255,.2)}
.glass::before{content:"";position:absolute;left:12px;top:16px;bottom:16px;width:7px;border-radius:3px;background:var(--pink)}
.glass.plain{background:linear-gradient(180deg,rgba(10,6,19,.78),rgba(10,6,19,.7))}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font:500 23px/1.25 var(--f-ui)}
.ph p{margin:2px 0 0;font:400 12px var(--f-ui);color:var(--mute)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;height:38px;padding:0 34px 0 14px;border-radius:9px;background:var(--ink);border:1px solid var(--violet);font:400 12px var(--f-ui);cursor:pointer}
.sel::after{content:"⌄";position:absolute;right:12px;top:6px;pointer-events:none;font-size:14px}
.seg{display:flex;gap:6px}
.seg button{width:39px;height:38px;border-radius:8px;background:var(--ink);border:1px solid var(--violet);font-size:19px;line-height:1}
.seg button.on{background:var(--violet)}
.field{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:8px;background:var(--panel);border:1px solid #391951;flex:1;min-width:200px}
.field svg{flex:none;color:var(--faint)}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;font:400 14px var(--f-ui)}
.field input::placeholder{color:var(--faint)}
.field:focus-within{border-color:var(--neon)}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:5px 13px;border-radius:99px;border:1px solid var(--line);background:var(--ink);font:500 11px var(--f-mono);letter-spacing:.08em;color:var(--mute2)}
.chip.on{background:var(--lime);color:var(--deep);border-color:var(--lime)}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:9px;background:var(--ink);border:1px solid var(--violet);font:500 13px var(--f-th)}
.btn:hover{background:#1a0f2e}
.btn.pri{background:var(--lime);border-color:var(--lime);color:var(--deep)}
.btn.pri:hover{background:#d4ff8a}
.btn.pink{background:var(--pink);border-color:var(--pink);color:var(--ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* readiness */
.ready{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center;padding:12px 16px;border-radius:14px;background:rgba(3,2,5,.55);border:1px solid var(--line);margin-bottom:18px}
.ready .pct{font:600 28px var(--f-mono);color:var(--lime);font-variant-numeric:tabular-nums}
.ready .meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.ready .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--pink));border-radius:3px}
.ready ul{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 16px;margin:4px 0 0;padding:0;list-style:none;font:400 12px var(--f-th);color:var(--mute)}
.ready li::before{content:"○ ";color:var(--faint)}
.ready li.ok{color:var(--text)}
.ready li.ok::before{content:"● ";color:var(--lime)}

/* work cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;align-items:stretch}
.wcard{position:relative;background:var(--card);border:1.5px solid var(--card-line);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:0;min-width:0}
.wcard.is-sel{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime),0 0 24px rgba(194,255,98,.18)}
.wcard.drag-over{outline:2px dashed var(--yellow);outline-offset:3px}
.wcard.dragging{opacity:.45}
.wprev{position:relative;aspect-ratio:272/190;border-radius:14px;overflow:hidden;background:#7435d5;cursor:pointer}
.wprev img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.wprev:hover img{transform:scale(1.03)}
.badge-sel{position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:6px;background:var(--lime);color:var(--deep);font:500 12px var(--f-th)}
.mbtn{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:6px;background:var(--deep);display:grid;place-items:center}
.mbtn:hover{background:#2a1a45}
.cap{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:8px;max-width:calc(100% - 70px);padding:6px 9px;background:var(--deep);font:700 10px var(--f-mono);letter-spacing:.06em;color:var(--lime);text-transform:uppercase}
.cap span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.noimg{display:grid;place-items:center;height:100%;color:var(--mute2);font-size:12px}
.pop{position:absolute;right:20px;top:52px;z-index:5;min-width:150px;padding:6px;border-radius:10px;background:var(--deep);border:1px solid var(--card-line);box-shadow:0 10px 30px rgba(0,0,0,.6);display:flex;flex-direction:column}
.pop button{padding:8px 10px;border-radius:6px;text-align:left;font:400 13px var(--f-th)}
.pop button:hover{background:#2a1a45}
.pop button.d{color:var(--bad)}
.wbody{display:flex;flex-direction:column;gap:12px;padding:16px 10px 6px;flex:1}
.lab{display:flex;justify-content:space-between;gap:8px;font:500 10px var(--f-mono);letter-spacing:.08em;color:var(--lime);text-transform:uppercase}
.lab em{font-style:normal;font-weight:400;color:var(--mute2);flex:none}
.wt{margin:2px 0 0;font:600 clamp(22px,2vw,28px)/1.2 var(--f-th);overflow-wrap:anywhere}
.wd{margin:4px 0 0;font:300 14px/1.5 var(--f-th);color:var(--mute2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:3em}
.finfo{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding-top:12px;border-top:1px solid var(--line);font:400 11px var(--f-mono);color:var(--mute2);margin-top:auto}
.finfo .st{font:400 11px var(--f-th);color:var(--lime);display:flex;align-items:center;gap:6px;white-space:nowrap}
.finfo .st::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--lime)}
.finfo .st.done{color:var(--yellow)}
.finfo .st.done::before{background:var(--yellow)}
.go{display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 16px 0 17px;border-radius:12px;background:var(--lime);color:var(--deep);font:500 18px var(--f-th);margin-top:4px}
.go span{display:flex;align-items:center;gap:10px}
.go:hover{background:#d4ff8a}
.add{border:1.5px solid var(--pink);border-radius:15px;background:var(--ink);min-height:300px;padding:9px;display:flex}
.add .in{flex:1;border:1px solid var(--violet);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;transition:background .15s;position:relative}
.add:hover .in,.add.over .in{background:#12081f}
.add .plus{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--yellow);color:var(--yellow);display:grid;place-items:center;font-size:30px;line-height:1}
.add b{font:500 15px var(--f-th)}
.add small{font:400 11px/1.5 var(--f-th);color:var(--mute)}
.add .star{position:absolute;left:8px;top:6px;color:var(--yellow);font-size:20px}
/* list layout */
.grid.list{grid-template-columns:1fr;gap:12px}
.grid.list .wcard{flex-direction:row;align-items:stretch;gap:16px;border-radius:18px}
.grid.list .wprev{width:240px;flex:none;aspect-ratio:auto;min-height:150px}
.grid.list .wbody{padding:4px 6px}
.grid.list .go{height:44px;font-size:15px;width:max-content;gap:16px}
.grid.list .add{min-height:120px}
.grid.list .add .in{flex-direction:row}
.empty{padding:40px 20px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:16px}

/* AI page */
.ai{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:20px;align-items:start}
.pick{display:flex;flex-direction:column;gap:8px;max-height:620px;overflow:auto;padding-right:4px}
.pitem{display:flex;gap:12px;align-items:center;padding:8px;border-radius:12px;background:rgba(3,2,5,.6);border:1.5px solid var(--line);text-align:left;width:100%}
.pitem img,.pitem .noimg{width:64px;height:48px;border-radius:8px;object-fit:cover;flex:none;background:#7435d5}
.pitem .t{min-width:0;flex:1}
.pitem b{display:block;font:500 14px var(--f-th);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem small{font:400 11px var(--f-mono);color:var(--mute2)}
.pitem .ck{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none;color:transparent}
.pitem.on{border-color:var(--lime)}
.pitem.on .ck{background:var(--lime);border-color:var(--lime);color:var(--deep)}
.score-pill{margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--violet);font:600 11px var(--f-mono)}
.out{min-width:0;display:flex;flex-direction:column;gap:18px}
.placeholder{display:grid;place-items:center;text-align:center;min-height:300px;padding:30px;border-radius:18px;background:rgba(3,2,5,.55);border:1px dashed var(--card-line);color:var(--mute);font:400 16px/1.9 var(--f-th)}
.placeholder b{color:var(--yellow);font-weight:500}
.notice{display:flex;gap:12px;padding:12px 16px;border-radius:12px;background:rgba(250,242,10,.08);border:1px solid rgba(250,242,10,.4);font:400 13px/1.6 var(--f-th);color:var(--text)}
.notice i{font-style:normal;color:var(--yellow)}
.rep{background:var(--card);border:1.5px solid var(--card-line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.rep-h{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.rep-h img{width:132px;aspect-ratio:272/190;object-fit:cover;border-radius:12px;background:#7435d5}
.rep-h .t{flex:1;min-width:180px}
.rep-h h3{margin:0;font:600 24px/1.2 var(--f-th)}
.src{display:inline-block;margin-top:6px;padding:2px 9px;border-radius:99px;font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--mute2)}
.src.ai{border-color:var(--neon);color:var(--neon)}
.big{text-align:center;min-width:96px}
.big b{display:block;font:600 46px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.big small{font:400 11px var(--f-th);color:var(--mute2)}
.sum{margin:0;font:300 15px/1.7 var(--f-th);color:var(--text)}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 22px}
.meter-row{display:flex;flex-direction:column;gap:5px}
.meter-row div:first-child{display:flex;justify-content:space-between;font:400 13px var(--f-th)}
.meter-row b{font:600 13px var(--f-mono);font-variant-numeric:tabular-nums}
.track{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--violet),var(--pink))}
.track i.lo{background:var(--bad)}
.pal{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pal span{display:flex;align-items:center;gap:6px;font:400 11px var(--f-mono);color:var(--mute2)}
.pal i{width:26px;height:26px;border-radius:7px;border:1px solid rgba(255,255,255,.25)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.box{padding:14px 16px;border-radius:14px;background:rgba(3,2,5,.5);border:1px solid var(--line);min-width:0}
.box h4{margin:0 0 8px;font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.box.g h4{color:var(--lime)} .box.w h4{color:var(--yellow)} .box.e h4{color:var(--pink)}
.box ul{margin:0;padding-left:18px;font:300 14px/1.65 var(--f-th);display:flex;flex-direction:column;gap:6px}
.box.e{border-color:rgba(255,13,163,.5)}
.order{display:flex;flex-direction:column;gap:10px}
.order ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.order li{display:flex;gap:10px;align-items:center;font:400 14px var(--f-th)}
.order li b{width:28px;font:600 12px var(--f-mono);color:var(--lime)}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--faint);border-top-color:var(--lime);animation:sp .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}

/* settings */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px 28px;max-width:1000px}
.fl{display:flex;flex-direction:column;gap:6px}
.fl label{font:500 14px var(--f-th)}
.fl .hint{font:400 11px var(--f-th);color:var(--mute)}
.inp{height:38px;padding:0 12px;border-radius:8px;background:var(--panel);border:1px solid #391951;outline:0;width:100%}
textarea.inp{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.5}
.inp:focus{border-color:var(--neon)}
select.inp{appearance:none;-webkit-appearance:none}
.sect{margin:26px 0 12px;font:500 18px var(--f-th);display:flex;align-items:center;gap:10px}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}
.preview-neon{display:flex;gap:12px;align-items:flex-end;font:italic 900 48px/1 var(--f-th);padding:14px 0}
.preview-neon .a{color:var(--neon);text-shadow:0 0 20px rgba(168,91,255,.7)}
.preview-neon .b{color:#fff;font-size:36px}

/* modal + toast */
.veil{position:fixed;inset:0;z-index:60;background:rgba(3,2,5,.78);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px}
.dlg{width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--card);border:1.5px solid var(--card-line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.dlg h2{margin:0;font:600 22px var(--f-th)}
.dlg .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.dlg .pv{width:100%;aspect-ratio:16/8;object-fit:cover;border-radius:12px;background:#7435d5}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;padding:10px 18px;border-radius:99px;background:var(--lime);color:var(--deep);font:500 13px var(--f-th);box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center}
.foot{align-self:flex-start;padding:6px 12px;border-radius:99px;background:rgba(3,2,5,.85);font:400 10px var(--f-ui);color:var(--mute);letter-spacing:.02em}


/* auth */
body.authing .side,body.authing .shell{display:none}
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;overflow:hidden}

.a-hero{position:relative;min-height:520px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding-bottom:6px}

.bubble{position:absolute;z-index:2;left:2%;top:18px;max-width:230px;padding:12px 18px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:46% 54% 50% 50%/60% 55% 45% 40%;font:italic 900 19px/1.25 var(--f-th);text-align:center;transform:rotate(-5deg);box-shadow:5px 5px 0 var(--pink)}

.burst{position:absolute;z-index:0;right:6%;top:14%;width:300px;height:300px;background:var(--pink);clip-path:polygon(50% 0,59% 22%,80% 8%,76% 33%,100% 36%,82% 54%,98% 74%,73% 72%,70% 98%,52% 80%,31% 100%,29% 74%,2% 78%,20% 55%,0% 34%,26% 31%,22% 6%,41% 22%);opacity:.9}
.a-card{padding:26px 28px 26px 40px}

(()=>{
'use strict';
/* ---------- helpers ---------- */

  dots:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#faf6ff" stroke-width="2" stroke-linecap="round"><path d="M9 4h.01M9 9h.01M9 14h.01"/></svg>',

/* ---------- storage ---------- */
const DB={mem:new Map(),db:null,pre:'',opened:false,
  k(x){return this.pre+x},
  async open(){if(this.opened)return;this.opened=true;try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('pk-blobs',1);r.onupgradeneeded=()=>r.result.createObjectStore('b');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.db=null}},
  put(k,v){k=this.k(k);this.mem.set(k,v);if(!this.db)return Promise.resolve();return new Promise(res=>{try{const t=this.db.transaction('b','readwrite');t.objectStore('b').put(v,k);t.oncomplete=res;t.onerror=res}catch(e){res()}})},
  get(k){k=this.k(k);if(this.mem.has(k))return Promise.resolve(this.mem.get(k));if(!this.db)return Promise.resolve(null);return new Promise(res=>{try{const r=this.db.transaction('b').objectStore('b').get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)}catch(e){res(null)}})},
  del(k){k=this.k(k);this.mem.delete(k);if(!this.db)return Promise.resolve();return new Promise(res=>{try{const t=this.db.transaction('b','readwrite');t.objectStore('b').delete(k);t.oncomplete=res;t.onerror=res}catch(e){res()}})}
};

/* accounts live in this browser only; passwords are salted + hashed (PBKDF2) */
const b64e=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64d=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function hashPw(pw,saltB64){
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return b64e(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64d(saltB64),iterations:150000,hash:'SHA-256'},key,256));
}

function sortedWorks(){
  let a=state.works.slice();
  const q=state.q.trim().toLowerCase();
  if(q)a=a.filter(w=>[w.title,w.desc,w.tools,(w.tags||[]).join(' '),catTH(w.cat),w.cat].join(' ').toLowerCase().includes(q));
  if(state.cat!=='all')a=a.filter(w=>w.cat===state.cat);
  const s=state.sort;
  a.sort((x,y)=>s==='old'?x.added-y.added:s==='name'?x.title.localeCompare(y.title,'th'):s==='score'?((y.analysis?.overall??-1)-(x.analysis?.overall??-1)):s==='custom'?(x.order-y.order):(y.added-x.added));
  return a;
}
function portfolioNo(w){const a=state.works.slice().sort((x,y)=>x.order-y.order);return a.findIndex(x=>x.id===w.id)+1}
function readiness(){
  const W=state.works,p=state.profile;
  const checks=[
    ['มีผลงานอย่างน้อย 5 ชิ้น',W.length>=5],
    ['ทุกชิ้นมีคำอธิบาย',W.length>0&&W.every(w=>(w.desc||'').trim().length>=15)],
    ['มีอย่างน้อย 2 หมวด',new Set(W.map(w=>w.cat)).size>=2],
    ['ให้ AI วิเคราะห์แล้ว 3 ชิ้น',W.filter(w=>w.analysis).length>=3],
    ['กรอกโปรไฟล์และเป้าหมาย',!!(p.name.trim()&&p.level.trim()&&p.goal.trim())]
  ];
  return{checks,pct:Math.round(checks.filter(c=>c[1]).length/checks.length*100)};
}

function suggestOrder(rank){
  if(rank.length<3)return rank;
  const [a,b,...rest]=rank;return [a,...rest,b];
}
function expertPack(){
  const p=state.profile;
  const ct=Object.entries(state.acct?.links||{}).filter(e=>e[1]).map(e=>linkName(e[0])+': '+e[1]).join(' | ');
  const L=[`สรุปพอร์ตของ ${p.name} (${p.level})${p.goal?' เป้าหมาย: '+p.goal:''}`,ct?'ช่องทางติดต่อ: '+ct:'','หมายเหตุ: AI ตรวจเบื้องต้นเฉพาะด้านการออกแบบ ขอให้ช่วยดูด้านเนื้อหาและความเหมาะสมกับเป้าหมาย',''];
  state.works.slice().sort((a,b)=>a.order-b.order).forEach((w,i)=>{
    L.push(`${i+1}. ${w.title} [${w.cat} / ${w.kind||'ORIGINAL'}]${w.analysis?` AI ${w.analysis.overall}/100`:''}`);
    if(w.desc)L.push('   ที่มา: '+w.desc);
    if(w.tools)L.push('   เครื่องมือ/บทบาท: '+w.tools);

async function addFiles(files){
  files=files.filter(f=>f.type.startsWith('image/'));

    let dim={width:0,height:0};try{dim=await createImageBitmap(f)}catch(e){toast(`เปิด “${f.name}” ไม่ได้`);continue}

/* ---------- AI analysis ---------- */
async function measure(blob,w){
  const bmp=await createImageBitmap(blob);
  const W=bmp.width,H=bmp.height,sc=Math.min(1,200/Math.max(W,H));
  const cw=Math.max(8,Math.round(W*sc)),ch=Math.max(8,Math.round(H*sc));
  const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
  const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(bmp,0,0,cw,ch);
  const px=cx.getImageData(0,0,cw,ch).data,N=cw*ch;
  const g=new Float32Array(N);let sum=0;
  const hue=new Float32Array(12);let satN=0,satSum=0;
  const buckets=new Map();
  for(let i=0;i<N;i++){
    const r=px[i*4],gg=px[i*4+1],b=px[i*4+2];
    const y=.299*r+.587*gg+.114*b;g[i]=y;sum+=y;
    const mx=Math.max(r,gg,b),mn=Math.min(r,gg,b),d=mx-mn,s=mx?d/mx:0;satSum+=s;
    if(s>.25&&mx>50){let h=mx===r?((gg-b)/d)%6:mx===gg?(b-r)/d+2:(r-gg)/d+4;h=(h*60+360)%360;hue[Math.floor(h/30)%12]++;satN++}
    const k=((r>>4)<<8)|((gg>>4)<<4)|(b>>4);let e=buckets.get(k);if(!e){e=[0,0,0,0];buckets.set(k,e)}e[0]++;e[1]+=r;e[2]+=gg;e[3]+=b;
  }
  const mean=sum/N;let v=0;for(let i=0;i<N;i++)v+=(g[i]-mean)**2;const std=Math.sqrt(v/N);
  let em=0,ex=0,ey=0;const edges=new Float32Array(N);
  for(let y=1;y<ch-1;y++)for(let x=1;x<cw-1;x++){const i=y*cw+x,m=(Math.abs(g[i+1]-g[i-1])+Math.abs(g[i+cw]-g[i-cw]))/2;edges[i]=m;em+=m;ex+=m*x;ey+=m*y}
  const ed=em/N;const cxn=em?ex/em/cw:.5,cyn=em?ey/em/ch:.5;
  const pts=[[1/3,1/3],[2/3,1/3],[1/3,2/3],[2/3,2/3],[.5,.5]];
  const dist=Math.min(...pts.map(p=>Math.hypot(p[0]-cxn,p[1]-cyn)));
  // palette
  const arr=[...buckets.values()].sort((a,b)=>b[0]-a[0]);const pal=[];
  for(const e of arr){const c=[e[1]/e[0],e[2]/e[0],e[3]/e[0]];if(pal.every(p=>Math.hypot(p[0]-c[0],p[1]-c[1],p[2]-c[2])>70))pal.push(c);if(pal.length>=5)break}
  const hex=c=>'#'+c.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
  const hueShare=[...hue].map(x=>satN?x/satN:0),usedHues=hueShare.filter(x=>x>.08).length;
  const satFrac=satN/N;
  // spread: how much of the image has any detail
  let busy=0;for(let i=0;i<N;i++)if(edges[i]>12)busy++;busy/=N;
  return{W,H,ed,std,mean,satMean:satSum/N,satFrac,usedHues,dist,cxn,cyn,palette:pal.map(hex),busy,ratio:W/H,size:blob.size};
}
const band=(v,a,b,c,d)=>v<a?0:v<b?(v-a)/(b-a):v<=c?1:v<d?(d-v)/(d-c):0;
function scoreLocal(w,m){
  const near=1-clamp(m.dist/.25,0,1);
  const detail=band(m.ed,3,6,30,48);
  const comp=Math.round(34+31*near+35*detail);
  const contrast=band(m.std,18,42,78,105);
  const harmony=m.satFrac<.05?.8:m.usedHues<=3?1:m.usedHues<=5?.65:.4;
  const color=Math.round(32+33*contrast+35*harmony);
  const long=Math.max(m.W,m.H);
  const res=long>=2400?1:long>=1600?.85:long>=1000?.6:.3;
  const sharp=clamp((m.ed-3)/5,0,1);
  const tech=Math.round(28+44*res+28*sharp);
  let p=10;p+=(w.desc||'').trim().length>=30?30:(w.desc||'').trim().length>=15?18:0;p+=(w.tags||[]).length>=2?15:(w.tags||[]).length?7:0;p+=(w.tools||'').trim()?15:0;p+=w.title&&w.title.length>=3&&!/^(img|image|screenshot|untitled|ไม่มีชื่อ)/i.test(w.title)?15:0;p+=(w.kind?15:0);
  const present=clamp(Math.round(p),0,100);
  const overall=Math.round(comp*.3+color*.3+tech*.2+present*.2);
  const S=[],Im=[];
  if(near>.6)S.push('จุดโฟกัสวางได้ถูกจังหวะ สายตาคนดูตกที่พระเอกของภาพเลย ไม่ต้องเดา');
  else Im.push('จุดโฟกัสลอย ๆ ตาคนดูไม่รู้ต้องไปไหนก่อน ลองขยับตัวเอกไปแนวเส้นสามส่วน หรือครอปให้แน่นขึ้น');
  if(m.ed<5)Im.push('ภาพโล่งและรายละเอียดน้อย ดูเหมือนยังไม่เสร็จ ลองเติมพื้นผิว เงา หรือของประกอบให้ภาพมีมิติ');
  else if(m.ed>34||m.busy>.5)Im.push('รายละเอียดแน่นทั้งภาพ ตาไม่มีที่พัก ลองลดความเข้มของฉากหลังหรือเว้นที่ว่าง ตัวเอกจะเด่นขึ้นทันที');
  else S.push('ปริมาณรายละเอียดกำลังดี ไม่แน่นไม่โล่งเกินไป');
  if(m.std>=42&&m.std<=80)S.push('มืดกับสว่างต่างกันชัด ย่อเป็นภาพเล็กในพอร์ตก็ยังอ่านออก');

async function shrink(blob,max){
  const b=await createImageBitmap(blob);const s=Math.min(1,max/Math.max(b.width,b.height));
  const c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
}

${imgs.length?'ภาพที่แนบคือผลงานชิ้นนี้ ให้ดูภาพจริงประกอบ':'ไม่มีภาพแนบ ให้ใช้ตัวเลขและข้อมูลด้านล่างเท่านั้น และอย่าเดาเนื้อหาในภาพ'}

async function analyze(ids){
  ids=ids.filter(id=>!state.running.has(id));if(!ids.length)return;
  state.view='analyze';ids.forEach(id=>{state.sel.add(id);state.running.add(id)});render();
  window.scrollTo({top:0,behavior:'smooth'});
  for(const id of ids){
    const w=state.works.find(x=>x.id===id);if(!w){state.running.delete(id);continue}
    try{
      const blob=await blobOf(w);if(!blob)throw new Error('no blob');
      const m=await measure(blob,w);
      w.analysis=scoreLocal(w,m);save();refreshOut();
      try{
        const c=await askClaude(w,blob,w.analysis,m);
        if(c){const a=w.analysis;a.summary=c.summary;a.strengths=c.strengths;if(c.improvements.length)a.improvements=c.improvements;if(c.questions.length)a.questions=c.questions;if(c.visual!=null){a.localOverall=a.overall;a.overall=Math.round(.6*c.visual+.4*a.overall)}a.source='claude';save()}
      }catch(e){/* keep local result */}
    }catch(e){toast(`วิเคราะห์ “${w.title}” ไม่ได้ ลองใช้ไฟล์ภาพอื่น`)}
    state.running.delete(id);refreshOut();
  }
  if(state.view==='analyze')render();
}
function refreshOut(){
  if(state.view!=='analyze')return;
  const o=$('#out');if(!o)return;
  o.innerHTML=outHTML(state.works.filter(w=>state.sel.has(w.id)&&(w.analysis||state.running.has(w.id))));animateNums();
}

    <div class="a-tabs" role="tablist"><button type="button" role="tab" data-tab="login" class="${reg?'':'on'}" aria-selected="${!reg}">เข้าสู่ระบบ</button><button type="button" role="tab" data-tab="register" class="${reg?'on':''}" aria-selected="${reg}">ลงทะเบียน</button></div>
    <h1>${reg?'สร้างบัญชีใหม่':'กลับมาแล้วเหรอ'}</h1>
    <p class="sub">${reg?'ใส่แค่ชื่อกับรหัสผ่านก็เริ่มได้ ช่องทางติดต่อใส่เพิ่มทีหลังก็ได้':'ใส่ชื่อหรืออีเมลที่ใช้สมัครไว้'}</p>
    <form class="a-form" id="aForm" novalidate>
      ${reg?`<div class="fl"><label for="aName">ชื่อที่จะแสดง</label><input class="inp" id="aName" maxlength="30" autocomplete="nickname" placeholder="เช่น มะนาว, Nova" required></div>
      <div class="fl"><label for="aLevel">ระดับชั้น/รุ่น</label><select class="inp" id="aLevel">${LEVELS.map(l=>`<option>${l}</option>`).join('')}</select></div>`
      :`<div class="fl"><label for="aId">ชื่อหรืออีเมล</label><input class="inp" id="aId" autocomplete="username" required></div>`}
      <div class="fl"><label for="aPw">รหัสผ่าน${reg?' (อย่างน้อย 6 ตัว)':''}</label><div class="pw"><input class="inp" id="aPw" type="password" autocomplete="${reg?'new-password':'current-password'}" required><button type="button" data-act="showpw">แสดง</button></div></div>
      ${reg?`<div class="fl"><label for="aPw2">ยืนยันรหัสผ่าน</label><input class="inp" id="aPw2" type="password" autocomplete="new-password" required></div>
      <div class="fl"><label>เชื่อมช่องทาง (ไม่บังคับ)</label><div class="lbox" id="lbox"></div><div class="lchips" id="lchips">${LINKS.map(l=>`<button type="button" class="chip" data-lk="${l[0]}">${esc(l[1])}</button>`).join('')}</div>
      <span class="hint">เก็บไว้บนโปรไฟล์เพื่อให้ผู้เชี่ยวชาญติดต่อกลับ ยังไม่ใช่การล็อกอินผ่านบริการนั้นจริง</span></div>`:''}
      <p class="err" id="aErr" role="alert"></p>
      <button class="btn pri" type="submit" id="aGo" style="height:46px;justify-content:center;font-size:16px">${reg?'สร้างบัญชีเลย':'เข้าสู่ระบบ'}</button>
    </form>
    <p class="a-foot" style="margin-top:14px">${reg?'มีบัญชีแล้ว? <button type="button" class="linkbtn" data-tab="login">เข้าสู่ระบบ</button>':'ยังไม่มีบัญชี? <button type="button" class="linkbtn" data-tab="register">ลงทะเบียน</button> หรือ <button type="button" class="linkbtn" id="guestGo">ลองเข้าแบบเยี่ยมชม</button>'}</p>
    <p class="a-foot">บัญชีเก็บในเบราว์เซอร์เครื่องนี้ รหัสผ่านถูกเข้ารหัสก่อนเก็บ แต่ยังไม่ซิงก์ข้ามเครื่อง และถ้าลืมรหัสผ่านจะกู้คืนไม่ได้</p>
  </section></div>`;
}
function showAuth(mode='login'){
  document.body.classList.add('authing');const a=$('#auth');a.hidden=false;a.innerHTML=authHTML(mode);window.scrollTo(0,0);
  a.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showAuth(b.dataset.tab));
  const pwb=a.querySelector('[data-act=showpw]');if(pwb)pwb.onclick=e=>{e.stopPropagation();const i=$('#aPw');const show=i.type==='password';i.type=show?'text':'password';pwb.textContent=show?'ซ่อน':'แสดง'};
  const gg=$('#guestGo');if(gg)gg.onclick=()=>enterApp(GUEST());
  const box=$('#lbox');
  if(box)$('#lchips').querySelectorAll('[data-lk]').forEach(ch=>ch.onclick=()=>{
    const k=ch.dataset.lk,l=LINKS.find(x=>x[0]===k);
    const row=document.createElement('div');row.className='lrow';row.dataset.k=k;
    row.innerHTML=`<span>${esc(l[1])}</span><input class="inp" maxlength="100" placeholder="${esc(l[2])}" aria-label="${esc(l[1])}"><button type="button" class="x" aria-label="เอาออก">×</button>`;
    box.appendChild(row);ch.hidden=true;row.querySelector('input').focus();
    row.querySelector('.x').onclick=()=>{row.remove();ch.hidden=false};
  });
  const err=$('#aErr'),go=$('#aGo');
  $('#aForm').onsubmit=async e=>{
    e.preventDefault();err.textContent='';go.disabled=true;
    try{if(!(window.crypto&&crypto.subtle))throw 'เบราว์เซอร์นี้ไม่รองรับการเข้ารหัสรหัสผ่าน ลองเปิดผ่าน https หรือใช้โหมดเยี่ยมชม';
      mode==='register'?await doRegister():await doLogin()}
    catch(ex){err.textContent=typeof ex==='string'?ex:'มีบางอย่างผิดพลาด ลองใหม่อีกครั้ง'}
    go.disabled=false;
  };
  const first=$('#aName')||$('#aId');first&&first.focus();
}
async function doLogin(){
  const id=$('#aId').value.trim().toLowerCase(),pw=$('#aPw').value;
  if(!id||!pw)throw 'ใส่ชื่อหรืออีเมล กับรหัสผ่านให้ครบก่อน';
  const ac=state.accts.find(a=>a.name.toLowerCase()===id||['email','google'].some(k=>(a.links?.[k]||'').toLowerCase()===id));
  if(!ac)throw 'ไม่เจอบัญชีนี้ในเครื่องนี้ เช็กตัวสะกด หรือกดลงทะเบียนใหม่';
  if(await hashPw(pw,ac.salt)!==ac.hash)throw 'รหัสผ่านไม่ถูก ลองใหม่อีกที';
  enterApp(ac);toast('ยินดีต้อนรับกลับมา '+ac.name);
}
async function doRegister(){
  const name=$('#aName').value.trim(),pw=$('#aPw').value,pw2=$('#aPw2').value;
  if(name.length<2||name.length>30)throw 'ชื่อต้องยาว 2–30 ตัวอักษร';
  if(state.accts.some(a=>a.name.toLowerCase()===name.toLowerCase()))throw 'ชื่อนี้มีคนใช้แล้ว ลองชื่ออื่น';
  if(pw.length<6)throw 'รหัสผ่านสั้นไป ใช้อย่างน้อย 6 ตัว';
  if(pw!==pw2)throw 'รหัสผ่านสองช่องไม่ตรงกัน';
  const links={};
  for(const row of document.querySelectorAll('#lbox .lrow')){const v=row.querySelector('input').value.trim();if(!v)continue;
    if((row.dataset.k==='email'||row.dataset.k==='google')&&!/^\S+@\S+\.\S+$/.test(v))throw 'อีเมลดูไม่ถูกต้อง เช็กอีกที';links[row.dataset.k]=v}
  const em=(links.email||'').toLowerCase();
  if(em&&state.accts.some(a=>(a.links?.email||'').toLowerCase()===em))throw 'อีเมลนี้ถูกใช้สมัครไปแล้ว';
  const salt=b64e(crypto.getRandomValues(new Uint8Array(16)));
  const ac={id:uid(),name,salt,hash:await hashPw(pw,salt),links,created:Date.now()};
  state.accts.push(ac);saveAccts();
  try{localStorage.setItem('pk.d.'+ac.id,JSON.stringify({v:2,works:[],profile:{...DEF_PROFILE(),name,level:$('#aLevel').value},sort:'new',layout:'grid'}))}catch(e){}
  enterApp(ac);toast('สร้างบัญชีแล้ว เริ่มเพิ่มผลงานชิ้นแรกได้เลย');
}

/* ---------- boot ---------- */
try{localStorage.removeItem('pk.v1')}catch(e){}
loadAccts();
let sid=null;try{sid=localStorage.getItem('pk.session')}catch(e){}
const first=sid==='guest'?GUEST():state.accts.find(x=>x.id===sid);
if(first)enterApp(first);else showAuth('login');
})();
</script>
